version = 0.1

[default.build.parameters]
# Build on the host (Linux with cmake and a C++ compiler; works in AWS
# CloudShell). Use `make build USE_DOCKER=1` or `sam build --use-container` to
# build in the Lambda build image instead (needed on macOS/Windows hosts).
use_container = false
cached = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
confirm_changeset = true
