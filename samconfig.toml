version = 0.1

[default.build.parameters]
# Build in the Lambda build image so the compiled llama.cpp matches the runtime
# (needed on macOS/Windows hosts). In AWS CloudShell, which has no Docker, run
# `sam build --no-use-container` instead.
use_container = true
cached = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
resolve_s3 = true
confirm_changeset = true
