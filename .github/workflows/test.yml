name: test

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        env:
          CMAKE_ARGS: -DGGML_NATIVE=OFF
        run: pip install -r requirements-dev.txt
      - name: Test
        run: pytest -q
