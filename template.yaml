AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  elleLLM - SmolLM2-135M-Instruct (GGUF) running entirely inside AWS Lambda on
  the managed Python runtime, exposed as an OpenAI-compatible Chat Completions
  API on a Function URL. The model ships inside the zip: no container image,
  no ECR, no S3.

Parameters:
  ApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: >
      Bearer token clients must send (Authorization: Bearer <key>), like an
      OpenAI API key. Leave empty to allow unauthenticated access.
  ModelAlias:
    Type: String
    Default: smollm2-135m-instruct
    Description: Model id reported by /v1/models.
  MemorySize:
    Type: Number
    Default: 2048
    MinValue: 512
    MaxValue: 10240
    Description: >
      Lambda memory in MB. vCPUs scale with memory (1769 MB = 1 vCPU, 10240 MB
      = 6 vCPUs) and token speed scales with vCPUs.
  ContextSize:
    Type: Number
    Default: 4096
    Description: Context window (prompt + completion tokens) in tokens.
  WebAdapterLayerArn:
    Type: String
    Default: ""
    Description: >
      Override the AWS Lambda Web Adapter layer ARN. Empty uses the public
      x86_64 layer in the deployment region.

Conditions:
  HasApiKey: !Not [!Equals [!Ref ApiKey, ""]]
  HasAdapterOverride: !Not [!Equals [!Ref WebAdapterLayerArn, ""]]

Resources:
  LlmFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: run.sh
      Runtime: python3.12
      Architectures: [x86_64]
      MemorySize: !Ref MemorySize
      # Function URLs allow up to 15 minutes; API Gateway would cap us at 29s.
      Timeout: 120
      Layers:
        - !If
          - HasAdapterOverride
          - !Ref WebAdapterLayerArn
          - !Sub "arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerX86:25"
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          AWS_LWA_PORT: "8080"
          AWS_LWA_READINESS_CHECK_PATH: /v1/models
          AWS_LWA_INVOKE_MODE: response_stream
          MODEL_ALIAS: !Ref ModelAlias
          N_CTX: !Ref ContextSize
          API_KEY: !If [HasApiKey, !Ref ApiKey, !Ref AWS::NoValue]
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM
    Metadata:
      # src/Makefile installs dependencies and downloads the model into the zip.
      BuildMethod: makefile

Outputs:
  BaseUrl:
    Description: Use this as the OpenAI SDK base_url.
    Value: !Sub "${LlmFunctionUrl.FunctionUrl}v1"
  FunctionName:
    Value: !Ref LlmFunction
